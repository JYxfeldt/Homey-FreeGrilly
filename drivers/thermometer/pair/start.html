<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      color: #333;
    }
    h2 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #e85d04;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #e85d04;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      pointer-events: auto !important;
      opacity: 1 !important;
    }
    button.loading {
      background: #aaa;
      cursor: not-allowed;
    }
    .error {
      margin-top: 12px;
      color: #c0392b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>Connect to FreeGrilly</h2>
  <p>Enter the IP address of your FreeGrilly thermometer. You can find it in your router's DHCP list or in the device's WiFi settings.</p>
  <label for="ip">IP Address</label>
  <input type="text" id="ip" placeholder="192.168.1.100" value="192.168.200.10">
  <button id="btn">Connect</button>
  <p class="error" id="error"></p>

  <script>
    function onHomeyReady(Homey) {
      Homey.ready();
      init(Homey);
    }

    // Fallback in case onHomeyReady is delayed or called differently
    if (typeof window !== 'undefined') {
      window.onHomeyReady = function(Homey) {
        Homey.ready();
        init(Homey);
      };
    }

    function init(Homey) {
      var btn = document.getElementById('btn');
      var errorEl = document.getElementById('error');

      btn.addEventListener('click', function () {
        var ip = document.getElementById('ip').value.trim();
        errorEl.textContent = '';

        if (!ip) {
          errorEl.textContent = 'Please enter an IP address.';
          return;
        }

        btn.classList.add('loading');
        btn.textContent = 'Connecting…';

        function onSuccess() {
          btn.classList.remove('loading');
          btn.textContent = 'Connect';
          Homey.nextView();
        }

        function onError(err) {
          btn.classList.remove('loading');
          btn.textContent = 'Connect';
          errorEl.textContent = (err && err.message)
            ? err.message
            : 'Could not connect to the device. Check the IP address and try again.';
        }

        // Support both Promise-based (SDK3 modern) and callback-based emit
        var result = Homey.emit('validate', ip, function (err) {
          if (err) { onError(err); } else { onSuccess(); }
        });

        if (result && typeof result.then === 'function') {
          result.then(onSuccess).catch(onError);
        }
      });
    }
  </script>
</body>
</html>
